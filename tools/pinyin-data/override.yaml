# 魔光键影 (ff7-ime) 拼音覆盖表
#
# 本文件是人工确认的读音覆盖，供 tools/pinyin-data/extract.py 合并。
# 数字声调：1-4 为四声，5 为轻声；ü 写作 v。
#
# 合并优先级（高 -> 低）：
#   confirmed_phrases > char_rules > char_defaults > pypinyin 词组 > pypinyin 单字
#
# 说明：
#   * confirmed_phrases.readings 只对应词条中的汉字，标点/间隔号不占位。
#   * char_rules.when_contains 为子串条件；命中后把该词条中所有该字改为 reading。
#   * misread_candidates 是给 Lua 容错输入用的“允许误读集合”，不是规范读音。
#   * rare_watchlist 收录词表中出现的生僻字；不在 dict.txt 中的也保留读音备查。

version: 1
updated: "2026-10-28"

char_defaults:
  - char: "曾"
    reading: "zeng1"
    reason: "曾作姓氏/人名（Tseng）读 zēng，不读 céng"
  - char: "掴"
    reading: "guo2"
    reason: "掌掴 zhǎng guó；pypinyin 单字首选 guāi 不是规范主读音"
  - char: "谁"
    reading: "shei2"
    reason: "谁规范口语读 shéi（又读 shuí）；主读音取 shéi"
  - char: "杉"
    reading: "shan1"
    reason: "杉木 shān mù 为规范读音；shā 为又读，列入备选"
  - char: "辟"
    reading: "bi4"
    reason: "辟邪 bì xié；不读 pì"
  - char: "似"
    reading: "si4"
    reason: "似乎 sì hū；不读 shì"
  - char: "傀"
    reading: "kui3"
    reason: "傀儡 kuǐ lěi；不读 guī"
  - char: "脊"
    reading: "ji3"
    reason: "脊骨 jǐ gǔ；不读 jí"
  - char: "勒"
    reading: "le4"
    reason: "译名华勒斯/盖恩斯伯勒的“勒”读 lè，不读 lēi"
  - char: "缪"
    reading: "miu4"
    reason: "译名巴拔维拉缪的“缪”读 miù（如缪斯），不读 móu"
  - char: "耶"
    reading: "ye1"
    reason: "译名琪里耶/杜耶斯提的“耶”读 yē，不读 yé"
  - char: "伽"
    reading: "jia1"
    reason: "吉尔伽美什的“伽”读 jiā，不读 gā/qié"
  - char: "嚼"
    reading: "jiao2"
    reason: "嚼嚼（咀嚼）读 jiáo，不读 jué"
  - char: "哦"
    reading: "o5"
    reason: "句末语气词“哦”读轻声 o，不标阳平 ó"

char_rules:
  - char: "长"
    when_contains: "长杖"
    reading: "chang2"
    reason: "长杖 = cháng zhàng；pypinyin 词组误作 zhǎng"
  - char: "长"
    when_contains: "长靴"
    reading: "chang2"
    reason: "长靴 = cháng xuē；pypinyin 词组误作 zhǎng"
  - char: "长"
    when_contains: "长矛"
    reading: "chang2"
    reason: "长矛 = cháng máo"
  - char: "长"
    when_contains: "月长石"
    reading: "chang2"
    reason: "月长石 = yuè cháng shí"
  - char: "长"
    when_contains: "专长"
    reading: "chang2"
    reason: "专长 = zhuān cháng"
  - char: "重"
    when_contains: "重拾"
    reading: "chong2"
    reason: "重拾 = chóng shí；pypinyin 误作 zhòng"
  - char: "都"
    when_contains: "之都"
    reading: "du1"
    reason: "之都 = zhī dū（都城）；不读 dōu"
  - char: "得"
    when_contains: "我得"
    reading: "dei3"
    reason: "我得 = wǒ děi（必须）；不读 dé"
  - char: "得"
    when_contains: "得活着"
    reading: "dei3"
    reason: "得活着 = děi huó zhe（必须）；不读 dé"
  - char: "得"
    when_contains: "跑得掉"
    reading: "de5"
    reason: "跑得掉 = pǎo de diào；结构助词读轻声 de"
  - char: "得"
    when_contains: "得到"
    reading: "de2"
    reason: "得到 = dé dào"
  - char: "了"
    when_contains: "不得了"
    reading: "liao3"
    reason: "不得了 = bù dé liǎo；不读 le"
  - char: "弹"
    when_contains: "弹跳"
    reading: "tan2"
    reason: "弹跳 = tán tiào；不读 dàn"
  - char: "劲"
    when_contains: "劲歌"
    reading: "jing4"
    reason: "劲歌 = jìng gē（强劲有力）；不读 jìn"
  - char: "什"
    when_contains: "美什"
    reading: "shi2"
    reason: "吉尔伽美什的“什”读 shí，不读 shén"
  - char: "勒"
    when_contains: "华勒斯"
    reading: "le4"
    reason: "华勒斯（Wallace）的“勒”读 lè"
  - char: "勒"
    when_contains: "盖恩斯伯勒"
    reading: "le4"
    reason: "盖恩斯伯勒（Gainsborough）的“勒”读 lè"
  - char: "子"
    when_contains: "子民"
    reading: "zi3"
    reason: "子民 = zǐ mín；不读轻声 zi"
  - char: "只"
    when_contains: "两只"
    reading: "zhi1"
    reason: "两只 = liǎng zhī（量词）；不读 zhǐ"
  - char: "陆"
    when_contains: "第陆区"
    reading: "liu4"
    reason: "第陆区 = dì liù qū（陆是“六”的大写）；不读 lù"
  - char: "地"
    when_contains: "推心置腹地"
    reading: "de5"
    reason: "推心置腹地 = tuī xīn zhì fù de（状语助词，轻声）；不读 dì"
  - char: "子"
    when_contains: "刽子手"
    reading: "zi3"
    reason: "刽子手 = guì zǐ shǒu；子读 zǐ，不读轻声 zi"
  - char: "子"
    when_contains: "原子"
    reading: "zi3"
    reason: "原子 = yuán zǐ；不读轻声 zi"
  - char: "个"
    when_contains: "一个"
    reading: "ge5"
    reason: "一个 = yí ge（量词轻声）"
  - char: "个"
    when_contains: "这个"
    reading: "ge5"
    reason: "这个 = zhè ge（量词轻声）"
  - char: "卷"
    when_contains: "卷卷"
    reading: "juan3"
    reason: "卷卷的 = juǎn juǎn de（卷曲）；不读 juàn"

