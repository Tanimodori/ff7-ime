# 对照 schema：验证 lua_translator@名字（不带 *）从 rime.lua 的全局变量取模块。
schema:
  schema_id: ff7-ime_probe_global
  name: "FF7-IME Lua Probe (global from rime.lua)"
  version: "0.1.0"
  author: "ff7-ime lua-probe"
  description: |
    验证 lua_translator@ff7_ime_global：不做 require，直接查找全局表 ff7_ime_global。

switches:
  - name: ff7-ime_probe_enabled
    reset: 1

menu:
  page_size: 5

speller:
  alphabet: "zyxwvutsrqponmlkjihgfedcba"
  initials: "zyxwvutsrqponmlkjihgfedcba"
  delimiter: ""

engine:
  processors:
    - ascii_composer
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
    - fallback_segmentor
  translators:
    - lua_translator@ff7_ime_global
  filters:
    - uniquifier
