# moguang_jianying.custom.yaml
# encoding: utf-8
#
# 用户自定义补丁模板。放在 %APPDATA%\Rime\moguang_jianying.custom.yaml。
# 修改后执行 WeaselDeployer.exe /deploy 生效。
#
# 重要：schema 根节点没有 __patch，所以 librime 会自动把本文件的 patch
# 合并进 moguang_jianying.schema.yaml；不需要在 schema 里写 __include。
#
# 本文件默认只写了一个与 schema 相同的 menu/page_size（等于不改变默认值）。
# 需要改哪一项，就取消对应行的注释并改成想要的值；注意保持两个空格缩进。

patch:
  # 与 schema 默认一致；可直接改成 7/10 等
  menu/page_size: 5

# ---------------------------------------------------------------------------
# 候选数量与分页（取消注释并保持缩进后生效）
# ---------------------------------------------------------------------------
# 每页显示多少候选（1-10 比较合适；超过 10 时数字选词键不够用）
#   menu/page_size: 7
#
# Lua 最多返回多少候选（最终还会被 menu/page_size 分页）
#   moguang_jianying/top_n: 20
#
# 是否显示候选注释（数据文件第三列）
#   moguang_jianying/show_comment: false
#
# 数据文件（相对用户目录；也可以写绝对路径，建议统一用正斜杠）
#   moguang_jianying/data_file: "moguang_jianying_data.tsv"

# ---------------------------------------------------------------------------
# 开关默认值（取消注释并保持缩进后生效）
# ---------------------------------------------------------------------------
# 必须用索引 patch。索引表（与 schema 中 switches 顺序一致）：
#   @0  ascii_mode
#   @1  fuzzy_zh_z
#   @2  fuzzy_ch_c
#   @3  fuzzy_sh_s
#   @4  fuzzy_ng_n
#   @5  fuzzy_n_l
#   @6  fuzzy_r_l
#   @7  fuzzy_f_h
#   @8  fuzzy_en_eng
#   @9  fuzzy_in_ing
#   @10 keyword_mode
#   @11 initial_mode
#   @12 typo_mode
#
# 反例（错误写法）：switches/@fuzzy_zh_z/reset: 0
# Rime 会把 "@fuzzy_zh_z" 当作 "@0"（strtoul 返回 0），结果改的是
# ascii_mode，而不是 fuzzy_zh_z。这是本项目实测确认过的坑。
#
# 示例：关闭 zh/z 模糊，打开 n/l 模糊
#   switches/@1/reset: 0
#   switches/@5/reset: 1
#
# 示例：关闭关键词匹配、打开容错
#   switches/@10/reset: 0
#   switches/@12/reset: 1

# ---------------------------------------------------------------------------
# 键盘绑定追加示例（追加到最上面的 patch: 下面，保持两个空格缩进）
# ---------------------------------------------------------------------------
#   key_binder/bindings/+:
#     - { when: has_menu, accept: Tab, send: Page_Down }

# 说明：本文件不需要 customization 头；Rime 的 default.custom.yaml 里那段
# customization 只是 Weasel 方案选单写回的信息，手写 patch 时可以省略。
