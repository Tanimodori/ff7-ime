# Rime schema skeleton for 魔光键影 / moguang_jianying
# encoding: utf-8
#
# 设计目标
# ---------
# 1. 候选只来自固定词表（dict.txt 的 1212 条），不做造句、不做用户学习、
#    不做简繁转换。（没有候选时按空格仍会提交原始字母，这是 Rime editor 行为，
#    不会写入任何用户词库。）
# 2. 允许任意纯字母串（例如 lkcc）作为一个完整的 abc segment 进入 lua_translator。
# 3. 不引入 default.yaml 的 email / url / uppercase recognizer pattern：
#    recognizer 在 speller 之前运行，会接受 alphabet 之外的字符（- _ . @ 等），
#    并产生额外 tag/区间；保持 patterns 为空可让所有输入只由 speller +
#    abc_segmentor 决定，行为可预测。
# 4. 明确禁用 punctuator：词条内部自带 ！，·…… 等标点，由 Lua 原样作为
#    candidate text 输出；键盘上的标点键不参与组词，直接交给应用。
# 5. 不配置 script_translator / table_translator / user_dict / simplifier /
#    uniquifier，因此没有造句、没有用户词频、没有简繁转换、没有候选去重。
#
# 部署位置
# ---------
#   %APPDATA%\Rime\moguang_jianying.schema.yaml
#   %APPDATA%\Rime\moguang_jianying.custom.yaml      （可选，用户 patch）
#   %APPDATA%\Rime\lua\moguang_jianying.lua
#   %APPDATA%\Rime\moguang_jianying_data.tsv         （Lua 读取的数据文件）
# 修改后必须重新部署：WeaselDeployer.exe /deploy

schema:
  schema_id: moguang_jianying
  name: 魔光键影
  version: "0.1.0"
  author:
    - FF7 IME Project
  description: |
    魔光键影：最终幻想 VII 固定词条输入方案。
    候选只来自项目内置词表，不做造句、不做用户造词、不做简繁转换。
    输入为纯字母（全拼 / 简拼 / 关键词 / 容错由 Lua 匹配器实现）。
  # 不声明 dependencies：本方案不依赖 stroke 等辅助方案。

switches:
  # ---------------------------------------------------------------------------
  # 注意：Lua 默认值来自这里的 reset；用户在 custom.yaml 中应使用
  #       switches/@<索引>/reset 来 patch（索引从 0 开始，见下面的注释）。
  #       不要写 switches/@fuzzy_zh_z/reset —— Rime 会把 @fuzzy_zh_z 里的
  #       非数字部分解析成 0，静默改到第 0 项 ascii_mode 上。
  # ---------------------------------------------------------------------------
  - name: ascii_mode          # @0
    reset: 0
    states: [ 中文, 西文 ]
  - name: fuzzy_zh_z          # @1
    reset: 1
    states: [ 关闭, 开启 ]
  - name: fuzzy_ch_c          # @2
    reset: 1
    states: [ 关闭, 开启 ]
  - name: fuzzy_sh_s          # @3
    reset: 1
    states: [ 关闭, 开启 ]
  - name: fuzzy_ng_n          # @4
    reset: 1
    states: [ 关闭, 开启 ]
  - name: fuzzy_n_l           # @5
    reset: 0
    states: [ 关闭, 开启 ]
  - name: fuzzy_r_l           # @6
    reset: 0
    states: [ 关闭, 开启 ]
  - name: fuzzy_f_h           # @7
    reset: 0
    states: [ 关闭, 开启 ]
  - name: fuzzy_en_eng        # @8
    reset: 1
    states: [ 关闭, 开启 ]
  - name: fuzzy_in_ing        # @9
    reset: 1
    states: [ 关闭, 开启 ]
  - name: keyword_mode        # @10
    reset: 1
    states: [ 关闭, 开启 ]
  - name: initial_mode        # @11
    reset: 1
    states: [ 关闭, 开启 ]
  - name: typo_mode           # @12
    reset: 0
    states: [ 关闭, 开启 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    # 不加载 punctuator：见文件头第 4 条。
    - selector
    - navigator
    - express_editor

  segmentors:
    - ascii_segmentor      # ascii_mode 时整串标成 raw，Lua 不处理
    - matcher              # 读取 recognizer/patterns；本方案 patterns 为空
    - abc_segmentor        # 关键：把连续字母标成一个 abc segment
    # 不加载 punct_segmentor：没有 punctuator 映射，标点不会进入 composition
    - fallback_segmentor   # 兜底：未识别字符标成 raw（单字符，不进 Lua 匹配）

  translators:
    # '@*名字' 是 librime-lua 的自动 require 语法：
    # 从 <user_data_dir>/lua/ 或 <shared_data_dir>/lua/ 加载 名字.lua。
    # 不用 '*前缀' 的写法需要在 lua/rime.lua 里手动注册全局变量，
    # 会与用户已有的 rime.lua 冲突，故这里使用自动 require。
    - lua_translator@*moguang_jianying

  # 故意留空：uniquifier 会按候选文本去重（可能吞掉同文不同注释的词条），
  # simplifier 会做简繁转换，二者都会破坏“固定 1212 条”的语义。
  filters: []

speller:
  # 26 个小写 + 26 个大写。大写也放进 alphabet，保证 Shift 输入不会被
  # 直接漏给应用；Lua 内部统一转小写匹配。
  alphabet: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ"
  # 空分隔符：用户不需要也不能用 ' 或空格切分音节。
  # 空格仍由 express_editor 处理为“选第一个候选 / 提交原始输入”。
  delimiter: ""
  # 不定义 finals，且 initials 与 alphabet 相同：
  # abc_segmentor 的 expecting_an_initial 永远为真，任意字母序列
  # （包括 lkcc、zhangsan、zzzz）都会成为一个 [0, len) 的 abc segment，
  # 不会被拆成多个小段。
  initials: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ"
  # 0 = 不限制码长；不要设置 max_code_length，否则长输入会被自动切断。
  max_code_length: 0
  # 不自动上屏；关闭空格作为编码字符。
  auto_select: false
  use_space: false

# lua_translator 的真实配置命名空间。注意 env.name_space 在自动 require 时
# 是 "*moguang_jianying"（带星号），所以 Lua 里统一按 "moguang_jianying/..."
# 这个固定前缀读取，不依赖 env.name_space。
moguang_jianying:
  # 最多返回多少个候选（Lua 内部再与 100 取小）
  top_n: 10
  # 是否给候选加注释（注释内容由数据文件提供）
  show_comment: true
  # 数据文件：相对用户目录，或绝对路径
  data_file: "moguang_jianying_data.tsv"
  # 输入长度保护
  min_input_length: 1
  max_input_length: 32
  # 匹配器实现名（预留给算法模块替换）
  matcher: "builtin"

# 下面这个节点不参与 Rime 内置 translator；保留它是为了在 schema 里明确
# 写出“translator 的引用位置在 engine/translators”，避免误以为需要配置
# script_translator。lua_translator 不读取 translator/*。
translator:
  # 说明：lua_translator 对每个 segment 都会被调用，tag 过滤必须由 Lua 用
  # seg:has_tag("abc") 自己完成，Rime 不会因为这里写了 tag 就替它过滤。
  tag: abc

# 本方案不启用 punctuator。保留空 map 作为显式声明：如果以后要恢复标点，
# 在这里加 half_shape/full_shape 映射，并把 punctuator 加回 processors、
# punct_translator 加回 translators、punct_segmentor 加回 segmentors。
punctuator: {}

recognizer:
  # 必须为空！不要写 import_preset: default。
  # default.yaml 的 recognizer/patterns 里有：
  #   uppercase: "[A-Z][-_+.'0-9A-Za-z]*$"
  #   url: ...
  #   email: ...
  # recognizer 是 processor，运行在 speller 之前，会接受 alphabet 之外的
  # 字符（- _ . @ 等）；matcher 又会在 abc_segmentor 之前添加 segment。
  # 虽然整串 uppercase 与同长度 abc segment 会合并 tag（实测同时带 abc 和
  # uppercase），但带 . @ - 的输入会产生额外 segment，行为不可控。
  # 本方案统一保持 patterns 为空，只让 speller + abc_segmentor 决定分段。
  patterns: {}

key_binder:
  # 不 import_preset: default，避免默认的 comma/period 翻页绑定占用标点键。
  bindings:
    - { when: always, accept: Control+Shift+1, select: .next }
    - { when: always, accept: Control+Shift+2, toggle: ascii_mode }
    - { when: paging, accept: minus, send: Page_Up }
    - { when: has_menu, accept: equal, send: Page_Down }
    - { when: paging, accept: bracketleft, send: Page_Up }
    - { when: has_menu, accept: bracketright, send: Page_Down }

ascii_composer:
  good_old_caps_lock: true
  switch_key:
    # Shift 单击不再把原始字母直接上屏，避免误触绕过 Lua。
    Shift_L: noop
    Shift_R: noop
    Control_L: noop
    Control_R: noop
    Caps_Lock: clear
    Eisu_toggle: clear

menu:
  # 每页候选数；用户可在 moguang_jianying.custom.yaml 里 patch menu/page_size。
  page_size: 5

# 不要在本文件根部添加 __patch。librime 的 AutoPatchConfigPlugin 只有在
# 根节点没有显式 __patch 时才会自动应用 moguang_jianying.custom.yaml。
# 一旦写了 __patch，自定义 patch 会被静默跳过。
