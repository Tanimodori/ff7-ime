# 魔光键影 · 用户配置示例
# encoding: utf-8
#
# 复制/安装到 %APPDATA%\Rime\moguang_jianying.custom.yaml 后生效。
# 修改后运行 WeaselDeployer.exe /deploy（或“重新部署”）。
#
# 注意：默认 mgjy/use_switches: false，因此下面的 mgjy/fuzzy/* 是权威配置。
# 如果把 use_switches 改成 true，则 F4 菜单里的 mgjy_fuzzy_* 开关优先，
# 下面的 fuzzy 配置只在开关未定义时作为兜底。

patch:
  # ------------------------------------------------------------------
  # 候选数量 / 分页 / 注释
  # ------------------------------------------------------------------
  mgjy/top_n: 9
  menu/page_size: 9
  # DP 候选上限：越大越稳，越小越快（默认 64）
  mgjy/dp_max_candidates: 56
  mgjy/show_comment: true
  mgjy/show_score: false
  mgjy/use_switches: false

  # ------------------------------------------------------------------
  # 模糊音开关
  # A 类（题目要求）：zh/ch/sh -> z/c/s，ng -> n
  # B 类（可选，默认关）：n/l、r/l、f/h、en/eng、in/ing、an/ang、uan/uang
  # v_u：把 ü 的 v 拼写与 u 拼写视为互通（默认开）
  # ------------------------------------------------------------------
  mgjy/fuzzy/zh_z: true
  mgjy/fuzzy/ch_c: true
  mgjy/fuzzy/sh_s: true
  mgjy/fuzzy/ng_n: true
  mgjy/fuzzy/n_l: false
  mgjy/fuzzy/r_l: false
  mgjy/fuzzy/f_h: false
  mgjy/fuzzy/en_eng: false
  mgjy/fuzzy/in_ing: false
  mgjy/fuzzy/an_ang: false
  mgjy/fuzzy/uan_uang: false
  mgjy/fuzzy/v_u: true

  # ------------------------------------------------------------------
  # 容错
  # ------------------------------------------------------------------
  mgjy/typo/enabled: true
  mgjy/typo/max_edit: 2
  mgjy/typo/transposition: true
  mgjy/typo/syllable_swap: true

  # 声母 / 关键词模式（lkcc 等）
  mgjy/initial/enabled: true
  mgjy/keyword/gap_penalty: 0.02
  # 中段音节前缀子序列（meishao -> 美少女）；关闭后只保留声母关键词
  mgjy/keyword/syllable_subsequence: true

  # ------------------------------------------------------------------
  # 回退与置信度
  # ------------------------------------------------------------------
  # 最后一级回退用 bigram/trigram 召回 + Damerau/Dice-LCS 排序
  mgjy/fallback/use_lcs: true
  # DP 近似对齐低于该 raw 时视为噪声，不再作为强候选
  mgjy/fallback/dp_min_raw: 0.65
  # 回退池按重叠度预排序后，实际计算相似度的候选数上限
  mgjy/fallback/max_candidates: 96
  # 已有强命中（raw 达标）时改用小池，避免拖慢正常按键
  mgjy/fallback/strong_raw: 0.70
  mgjy/fallback/fast_max_candidates: 16

  # ------------------------------------------------------------------
  # 预编辑显示（只影响输入框里的拼音，不影响匹配与上屏文本）
  # ------------------------------------------------------------------
  # 开启预测音节分隔符：diou -> di'ou，shenluo -> shen'luo
  mgjy/preedit/enabled: true
  mgjy/preedit/separator: "'"

  # ------------------------------------------------------------------
  # 通道权重（高级调参；一般无需修改）
  # ------------------------------------------------------------------
  mgjy/weights/exact: 1.0
  mgjy/weights/fuzzy: 0.97
  mgjy/weights/fuzzy_prefix: 0.95
  mgjy/weights/prefix: 0.96
  mgjy/weights/swap: 0.93
  mgjy/weights/dp: 0.94
  mgjy/weights/initial_exact: 0.96
  mgjy/weights/initial: 0.86
  mgjy/weights/keyword: 0.80
  mgjy/weights/fallback: 0.55
